[package]
name = "work-timer"
version = "0.6.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo = { path = "../crates/nucleo" }
fila = { path = "../crates/fila" }
sinais = { path = "../crates/sinais" }
chrono = "0.4"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
# o dock: mostrar sem ativar, o lugar pelos monitores (Gdi, HiDpi), o arrastar (o mouse), por cima
# da barra (o gancho da Accessibility) e a área de trabalho (Dwm, Shell); a mesma versão do crate sinais
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility"] }
