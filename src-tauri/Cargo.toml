[package]
name = "work-timer"
version = "0.4.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo = { path = "../crates/nucleo" }
fila = { path = "../crates/fila" }
sinais = { path = "../crates/sinais" }
chrono = "0.4"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
# mostrar o dock sem ativá-lo (ShowWindow com SW_SHOWNOACTIVATE); a mesma versão do crate sinais
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Globalization"] }
