[package]
name = "nucleo"
version = "0.6.2"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
fila = { path = "../fila" }

[dev-dependencies]
tempfile = "3.27.0"
